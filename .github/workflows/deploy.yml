name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          package-manager-cache: false

      - name: Build pinned Lattice and search runtime
        env:
          MOON_HOME: ${{ runner.temp }}/lattice-moon
        run: |
          git clone https://github.com/0x4m4d3u5/lattice.git /tmp/lattice
          git -C /tmp/lattice checkout --detach "$(cat lattice-revision.txt)"
          cd /tmp/lattice
          bash scripts/install-ci-toolchain.sh
          export PATH="$MOON_HOME/bin:$PATH"
          moon update
          moon build cmd/main --target js --deny-warn
          moon build examples/local_graph --target js --deny-warn
          moon -C "$MOON_HOME/lib/core" bundle --target wasm-gc --deny-warn
          moon build examples/prepared_search --target wasm-gc --deny-warn

      - name: Build site
        env:
          LATTICE_SOURCE: /tmp/lattice
        run: node scripts/build.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
